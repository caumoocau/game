<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>푸앙이 런 — 지각 대소동</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--navy:#143365;--blue:#2B95C3;--sky:#3DB1D3;--light:#6BBEE2;--pink:#DEACC5;--pinkl:#F2D6E3;--beige:#D7BCA1}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;background:linear-gradient(160deg,#E8F4FB,#CFE8F5 55%,#B5DCEF);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;color:var(--navy);user-select:none;touch-action:manipulation}
#wrap{width:100%;max-width:960px}
#stage{position:relative;width:100%;border-radius:20px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.35);background:#fff}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(20,51,101,.82);color:#fff;padding:24px;z-index:5}
.overlay.hidden{display:none}
.overlay>*{flex-shrink:0}
.overlay{overflow-y:auto}
#ov-start,#ov-rank{background:linear-gradient(160deg,#143365 0%,#1d4a8a 75%,#215a97 130%)}
.nick-input{margin-top:4px;width:250px;padding:13px 18px;border-radius:999px;border:none;font-family:inherit;font-size:16px;font-weight:600;text-align:center;color:#143365;outline:none}
.btn-sub2{margin-top:12px;background:transparent;border:1.5px solid rgba(255,255,255,.5);color:#fff;font-size:13.5px;font-weight:600;border-radius:999px;padding:9px 24px;cursor:pointer;font-family:inherit}
.rank-list{width:100%;max-width:440px;margin-top:14px;background:rgba(255,255,255,.1);border-radius:14px;padding:8px 14px;max-height:270px;overflow-y:auto}
.rank-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.12);font-size:14px}
.rank-row:last-child{border-bottom:none}
.rank-no{width:28px;font-weight:800;color:#FFE29A;text-align:left}
.rank-nick{flex:1;text-align:left;font-weight:700}
.rank-score{font-weight:800}
.rank-time{font-size:11.5px;opacity:.7;width:62px;text-align:right}
.rank-row.me{background:rgba(222,172,197,.3);border-radius:8px}
.overlay img{width:100px;margin:6px 0 4px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ov-badge{background:var(--pinkl);color:var(--navy);font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 14px;letter-spacing:.4px}
.ov-title{font-size:27px;font-weight:800;margin:6px 0 4px}
.ov-sub{font-size:14.5px;line-height:1.65;opacity:.92;word-break:keep-all}
.ov-score{font-size:44px;font-weight:800;margin:8px 0 2px;color:#FFE29A}
.ov-rec{background:rgba(255,255,255,.14);border-radius:14px;padding:12px 22px;margin-top:14px;font-size:13.5px;line-height:1.6;max-width:none;white-space:nowrap}
.ov-rec b{color:#FFE29A}
.btn{margin-top:14px;border:none;cursor:pointer;font-family:inherit;background:var(--pink);color:var(--navy);font-size:17px;font-weight:800;border-radius:999px;padding:15px 42px;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .12s}
.btn:active{transform:scale(.95)}
.hint{margin-top:12px;font-size:12.5px;opacity:.75}
#footer{text-align:center;color:#3f6288;font-size:12px;margin-top:12px;line-height:1.6}
</style>
</head>

const FIELDS={
  humanities:{color:'#DEACC5',dark:'#8a4a6b',icon:'📖',name:'인문'},
  eng:{color:'#2B95C3',dark:'#0d3f5c',icon:'💻',name:'공학'},
  med:{color:'#3DB1D3',dark:'#115a6e',icon:'💊',name:'의약'},
  edu:{color:'#D7BCA1',dark:'#6e5638',icon:'🎓',name:'교육'}
};
const COURSES=[
  ['humanities','일상의 철학, 행복을 말하다'],['humanities','게임 인문학'],
  ['eng','딥러닝 기반 자연어처리'],['eng','멀티모달 인공지능의 이해와 학습'],
  ['eng','가상자산 추적과 분석'],['eng','데이터 과학의 EDA와 시각화'],
  ['eng','첨단전략산업과 기술보호'],['med','웰빙건강 다이어트'],
  ['edu','AI로 수업 혁신하기'],['edu','AI 기반 학습 콘텐츠 개발'],
  ['edu','AI로 설계하는 수업의 미래'],['edu','AI 기반 교수설계 포트폴리오 멘토링']
];
const STAGES=[
  {at:0,   name:'흑석역', sky:'#FDF3F8', far:'#F2D6E3'},
  {at:.28, name:'중앙대 정문', sky:'#EFF8FD', far:'#BFE3F2'},
  {at:.58, name:'203관 앞',   sky:'#FBF6EE', far:'#E8D9C3'},
  {at:.86, name:'310관 앞',   sky:'#EAF4FB', far:'#A8CFE8'}
];
const OBSTACLES=[
  {icon:'⏰',w:52,h:52,label:'알람시계'},
  {icon:'🛴',w:58,h:58,label:'킥보드'},
  {icon:'📚',w:56,h:52,label:'책더미'},
  {icon:'🚧',w:60,h:52,label:'공사 표지판'}
];
const TOTAL=8000, BASE_SPD=340, MAX_SPD=470;
const GRAV=2600, JUMP_V=-980;

let st, raf=null, lastT=0;
function reset(){
  st={dist:0,spd:BASE_SPD,score:0,hearts:3,
      py:GROUND,vy:0,onGround:true,
      obs:[],items:[],parts:[],toasts:[],
      nextObs:600,nextItem:900,nextPow:2600+Math.random()*1500,
      boostT:0,magT:0,hurtT:0,shake:0,
      collected:0,stageIdx:0,stageFlash:2,
      running:true,ended:false};
}

function spawnObs(){
  const o=OBSTACLES[Math.floor(Math.random()*OBSTACLES.length)];
  st.obs.push({x:W+80,type:o});
  st.nextObs=st.dist+ (430+Math.random()*300);
}
function spawnItems(){
  const c=COURSES[Math.floor(Math.random()*COURSES.length)];
  const n=4+Math.floor(Math.random()*3);
  const elevated=Math.random()<0.45;
  const val=elevated?150:100;
  const y= elevated? GROUND-150-Math.random()*40 : GROUND-46;
  for(let i=0;i<n;i++) st.items.push({x:W+80+i*54,y:y-(elevated? Math.sin(i/(n-1)*Math.PI)*26:0),c,val,kind:'course'});
  st.nextItem=st.dist+(260+Math.random()*220);
}
function spawnPow(){
  const kind=Math.random()<0.5?'coffee':'magnet';
  st.items.push({x:W+80,y:GROUND-120,kind});
  st.nextPow=st.dist+2600+Math.random()*1600;
}
function toast(txt,col){ st.toasts.push({txt,col,t:1.4}); if(st.toasts.length>3) st.toasts.shift(); }

function jump(){
  if(!st||!st.running) return;
  if(st.onGround){ st.vy=JUMP_V; st.onGround=false; }
}
document.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); jump(); }});
CV.addEventListener('pointerdown',jump);

function update(dt){
  const prog=st.dist/TOTAL;
  const boost= st.boostT>0? 1.4:1;
  st.spd=(BASE_SPD+(MAX_SPD-BASE_SPD)*prog)*boost;
  st.dist+=st.spd*dt;
  st.boostT=Math.max(0,st.boostT-dt);
  st.magT=Math.max(0,st.magT-dt);
  st.hurtT=Math.max(0,st.hurtT-dt);
  st.shake=Math.max(0,st.shake-dt*3);
  st.stageFlash=Math.max(0,st.stageFlash-dt);

  let si=0; STAGES.forEach((s,i)=>{ if(prog>=s.at) si=i; });
  if(si!==st.stageIdx){ st.stageIdx=si; st.stageFlash=1.6; }

  st.vy+=GRAV*dt; st.py+=st.vy*dt;
  if(st.py>=GROUND){ st.py=GROUND; st.vy=0; st.onGround=true; }

  if(st.dist>=st.nextObs && st.dist<TOTAL-700) spawnObs();
  if(st.dist>=st.nextItem && st.dist<TOTAL-400) spawnItems();
  if(st.dist>=st.nextPow && st.dist<TOTAL-1200) spawnPow();

  const mv=st.spd*dt;
  st.obs.forEach(o=>o.x-=mv);
  st.items.forEach(it=>{
    it.x-=mv;
    if(st.magT>0 && it.kind==='course'){
      const dx=150-it.x, dy=(st.py-52)-it.y, d=Math.hypot(dx,dy);
      if(d<230){ it.x+=dx/d*520*dt; it.y+=dy/d*520*dt; }
    }
  });
  st.obs=st.obs.filter(o=>o.x>-80);
  st.items=st.items.filter(i=>i.x>-60&&!i.got);
  st.toasts.forEach(t=>t.t-=dt); st.toasts=st.toasts.filter(t=>t.t>0);
  st.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;p.t-=dt;});
  st.parts=st.parts.filter(p=>p.t>0);

  const px=150, pw=62, ph=100, pyTop=st.py-ph;
  st.obs.forEach(o=>{
    if(o.hit) return;
    const ox=o.x-o.type.w/2, oy=GROUND-o.type.h;
    if(px+pw*0.35>ox && px-pw*0.35<ox+o.type.w && st.py>oy+8){
      if(st.boostT>0){ o.hit=true; burst(o.x,oy,'#FFE29A'); st.score+=50; toast('부스트 돌파! +50','#EF9F27'); }
      else if(st.hurtT<=0){ o.hit=true; st.hearts--; st.hurtT=1.2; st.shake=1; toast('아야! ♥ -1','#E24B4A');
        if(st.hearts<=0){ end(false); } }
    }
  });
  st.items.forEach(it=>{
    const dy=(pyTop+ph*0.5)-it.y;
    if(Math.abs(it.x-px)<52 && Math.abs(dy)<78){
      it.got=true;
      if(it.kind==='course'){ st.score+=it.val; st.collected++; burst(it.x,it.y,FIELDS[it.c[0]].color); toast('+'+it.val+' '+it.c[1],FIELDS[it.c[0]].dark); }
      else if(it.kind==='coffee'){ st.boostT=2.5; burst(it.x,it.y,'#B4762E'); toast('카페인 부스트!','#8a5a1e'); }
      else { st.magT=3.5; burst(it.x,it.y,'#7F77DD'); toast('K-MOOC 자석! 코인이 따라온다','#534AB7'); }
    }
  });

  if(st.dist>=TOTAL) end(true);
}
function burst(x,y,col){ for(let i=0;i<10;i++) st.parts.push({x,y,vx:(Math.random()-0.5)*420,vy:-Math.random()*380,t:0.55,col}); }

function draw(){
  const prog=Math.min(1,st.dist/TOTAL);
  const stg=STAGES[st.stageIdx];
  const shX=(Math.random()-0.5)*10*st.shake, shY=(Math.random()-0.5)*8*st.shake;
  CX.save(); CX.translate(shX,shY);
  CX.fillStyle=stg.sky; CX.fillRect(-20,-20,W+40,H+40);

  CX.fillStyle=stg.far;
  for(let i=0;i<6;i++){
    const bx=((i*210)-(st.dist*0.25)%210)-40;
    const bh=90+((i*53)%80);
    CX.fillRect(bx,GROUND-70-bh,120,bh+10);
    CX.fillStyle='rgba(255,255,255,0.35)';
    for(let wy=0;wy<3;wy++)for(let wx=0;wx<3;wx++) CX.fillRect(bx+14+wx*36,GROUND-50-bh+wy*34,18,16);
    CX.fillStyle=stg.far;
  }
  CX.fillStyle='#5f7d99'; CX.fillRect(-20,GROUND-62,W+40,10);
  CX.fillStyle='#e9e4da'; CX.fillRect(-20,GROUND,W+40,H-GROUND);
  CX.fillStyle='#d6cfc2';
  for(let i=0;i<10;i++){ const lx=((i*120)-(st.dist)%120); CX.fillRect(lx,GROUND+34,64,8); }

  CX.font='40px serif'; CX.textAlign='center';
  st.obs.forEach(o=>{ if(!o.hit){ CX.font=o.type.h+'px serif'; CX.fillText(o.type.icon,o.x,GROUND-4); } });

  st.items.forEach(it=>{
    if(it.kind==='course'){
      const f=FIELDS[it.c[0]];
      CX.fillStyle=f.color; CX.beginPath(); CX.arc(it.x,it.y,20,0,7); CX.fill();
      CX.fillStyle='rgba(255,255,255,0.85)'; CX.beginPath(); CX.arc(it.x,it.y,14,0,7); CX.fill();
      CX.font='16px serif'; CX.fillText(f.icon,it.x,it.y+6);
    } else {
      CX.fillStyle= it.kind==='coffee'? '#FAEEDA':'#EEEDFE';
      CX.beginPath(); CX.arc(it.x,it.y,22,0,7); CX.fill();
      CX.font='22px serif'; CX.fillText(it.kind==='coffee'?'☕':'🧲',it.x,it.y+8);
    }
  });

  st.parts.forEach(p=>{ CX.globalAlpha=Math.max(0,p.t/0.55); CX.fillStyle=p.col; CX.fillRect(p.x-4,p.y-4,8,8); CX.globalAlpha=1; });

  const ph=110, pw=ph*(IMG.width/IMG.height||0.9);
  const bob= st.onGround? Math.sin(st.dist*0.045)*4:0;
  const tilt= st.onGround? Math.sin(st.dist*0.045)*0.05 : -0.12;
  const blink= st.hurtT>0 && Math.floor(st.hurtT*10)%2===0;
  if(!blink){
    CX.save();
    CX.translate(150,st.py+bob);
    CX.rotate(tilt);
    if(st.boostT>0){ CX.shadowColor='#FFE29A'; CX.shadowBlur=26; }
    CX.fillStyle='rgba(20,51,101,0.18)'; CX.beginPath(); CX.ellipse(0,2,pw*0.34,9,0,0,7); CX.fill();
    if(IMG.complete) CX.drawImage(IMG,-pw/2,-ph,pw,ph);
    CX.restore();
  }

  CX.fillStyle='rgba(255,255,255,0.88)'; CX.fillRect(0,0,W,54);
  CX.fillStyle='#143365'; CX.font='700 19px Pretendard,sans-serif';
  CX.textAlign='left';
  CX.fillText('♥'.repeat(st.hearts)+'♡'.repeat(Math.max(0,3-st.hearts)),20,35);
  CX.textAlign='center';
  CX.fillText('310관까지 '+Math.max(0,Math.ceil((TOTAL-st.dist)/20))+'m',W/2,35);
  CX.textAlign='right';
  CX.fillText(st.score+'점',W-20,35);
  CX.fillStyle='#F2D6E3'; CX.fillRect(0,54,W,8);
  CX.fillStyle='#2B95C3'; CX.fillRect(0,54,W*prog,8);

  let ty=86;
  CX.font='700 15px Pretendard,sans-serif'; CX.textAlign='center';
  st.toasts.forEach(t=>{ CX.globalAlpha=Math.min(1,t.t/0.4); CX.fillStyle=t.col; CX.fillText(t.txt,W/2,ty); ty+=24; CX.globalAlpha=1; });

  if(st.stageFlash>0){
    CX.globalAlpha=Math.min(1,st.stageFlash);
    CX.fillStyle='#143365'; CX.font='800 30px Pretendard,sans-serif';
    CX.fillText(STAGES[st.stageIdx].name,W/2,160);
    CX.globalAlpha=1;
  }
  CX.restore();
}

function loop(t){
  if(!lastT) lastT=t;
  const dt=Math.min(0.033,(t-lastT)/1000); lastT=t;
  if(st.running){ update(dt); draw(); }
  raf=requestAnimationFrame(loop);
}

function recommend(score){
  if(score<500) return '오늘은 무리하지 말자... <b>웰빙건강 다이어트</b>로 <br> 체력부터 챙기는 걸 추천!';
  if(score<1000) return '차분하게 완주한 당신, <b>일상의 철학, 행복을 말하다</b>에서 <br> 여유를 찾아보세요.';
  if(score<1500) return '아이콘을 놓치지 않는 추적 본능! <br> <b>가상자산 추적과 분석</b>이 딱이에요.';
  return '엄청난 순발력! 그 두뇌 회전, <br> <b>딥러닝 기반 자연어처리</b>에 쓰면 최고겠는데요?';
}
let NICK='푸앙이', lastSeq=null;
const RKEY='puangrun_rank_v1';
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function loadRank(){ try{ return JSON.parse(localStorage.getItem(RKEY))||[]; }catch(e){ return []; } }
function saveRankList(list){ try{ localStorage.setItem(RKEY,JSON.stringify(list)); }catch(e){} }
function addRank(nick,score){
  const list=loadRank();
  const now=new Date();
  const p=v=>String(v).padStart(2,'0');
  const rec={nick,score,time:p(now.getHours())+':'+p(now.getMinutes())+':'+p(now.getSeconds()),seq:Date.now()};
  list.push(rec);
  list.sort((a,b)=> b.score-a.score || a.seq-b.seq);
  saveRankList(list.slice(0,100));
  return rec.seq;
}
function renderRank(){
  const list=loadRank();
  const box=document.getElementById('rank-list');
  if(!list.length){ box.innerHTML='<div class="rank-row">아직 기록이 없어요. 첫 주자가 되어보세요!</div>'; return; }
  box.innerHTML=list.slice(0,10).map((r,i)=>
    '<div class="rank-row'+(r.seq===lastSeq?' me':'')+'">'
    +'<span class="rank-no">'+(i+1)+'</span>'
    +'<span class="rank-nick">'+esc(r.nick)+'</span>'
    +'<span class="rank-score">'+r.score+'점</span>'
    +'<span class="rank-time">'+r.time+'</span></div>').join('');
}
function showRank(){
  renderRank();
  document.getElementById('ov-start').classList.add('hidden');
  document.getElementById('ov-end').classList.add('hidden');
  document.getElementById('ov-rank').classList.remove('hidden');
}

function end(cleared){
  if(st.ended) return;
  st.ended=true; st.running=false;
  st.score+= st.hearts*100 + (cleared?300:0);
  lastSeq=addRank(NICK,st.score);
  document.getElementById('end-badge').textContent= cleared? 'GOAL!':'GAME OVER';
  document.getElementById('end-title').textContent= cleared? NICK+', 강의실 도착!':NICK+', 폭삭 늦어버렸다...';
  document.getElementById('end-score').textContent= st.score+'점';
  document.getElementById('end-sub').innerHTML=
    (cleared? '지각은 했지만 오늘도 무사히 도착!':'괜찮아, 다시 달리면 돼!')+
    '<br>모은 K-MOOC 아이콘 '+st.collected+'개 · 남은 하트 보너스 +'+(st.hearts*100)+
    '<br>기록이 랭킹에 저장됐어요 🏆'+
    '<br><br>그거 아세요? <b>K-MOOC는 온라인이라 지각이 없답니다</b> 🐉';
  document.getElementById('end-rec').innerHTML='🎓 푸앙이의 추천 — '+recommend(st.score);
  document.getElementById('ov-end').classList.remove('hidden');
}
function start(){
  const v=document.getElementById('nick').value.trim();
  NICK= v? v.slice(0,8):'푸앙이';
  document.getElementById('ov-start').classList.add('hidden');
  document.getElementById('ov-end').classList.add('hidden');
  document.getElementById('ov-rank').classList.add('hidden');
  reset(); lastT=0;
  if(!raf) raf=requestAnimationFrame(loop);
}
document.getElementById('btn-start').addEventListener('click',start);
document.getElementById('btn-retry').addEventListener('click',()=>{
  document.getElementById('ov-end').classList.add('hidden');
  document.getElementById('ov-start').classList.remove('hidden');
});
document.getElementById('btn-rank-end').addEventListener('click',showRank);
document.getElementById('btn-rank-close').addEventListener('click',()=>{
  document.getElementById('ov-rank').classList.add('hidden');
  if(st.ended) document.getElementById('ov-end').classList.remove('hidden');
  else document.getElementById('ov-start').classList.remove('hidden');
});
const ADMIN_PW='moocauaza';
document.getElementById('rank-reset').addEventListener('click',()=>{
  const pw=prompt('운영자 비밀번호를 입력하세요');
  if(pw===null) return;
  if(pw===ADMIN_PW){
    if(confirm('랭킹 기록을 전부 삭제할까요? (되돌릴 수 없음)')){ saveRankList([]); renderRank(); alert('랭킹이 초기화되었습니다.'); }
  } else { alert('비밀번호가 올바르지 않습니다.'); }
});
document.getElementById('nick').addEventListener('keydown',e=>{ if(e.key==='Enter') start(); e.stopPropagation(); });
reset(); st.running=false; draw();
</script>
